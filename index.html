<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- PWA Service Worker Entegrasyonu -->

        if ('serviceWorker' in navigator) {

                    .then(reg => console.log('Offline Service Worker Aktif!', reg.scope))
                    .catch(err => console.error('SW Kayıt Hatası:', err));
            });
        }
    </script>

    <style>
        /* (Önceki versiyondaki tüm CSS kodları aynı şekilde kalacak) */
        body { background-color: #f8fafc; color: #1e293b; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .btn { transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; }
        .btn:active { transform: scale(0.95); }
        .sidebar-collapsed { width: 4.5rem !important; }
        .sidebar-collapsed .nav-text, .sidebar-collapsed .logo-text, .sidebar-collapsed .tools-header { display: none; }
        .sidebar-collapsed .nav-icon { margin-right: 0 !important; font-size: 1.5rem; }
        .sidebar-collapsed .p-4.border-b { padding: 1rem 0.5rem; text-align: center; justify-content: center; }
        .sidebar-collapsed .btn-sidebar { padding: 0.75rem; justify-content: center; }
        #sidebar { transition: width 0.3s ease; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .excel-table { border-collapse: collapse; width: 100%; font-size: 0.75rem; text-align: center; }
        .excel-table th, .excel-table td { border: 1px solid #cbd5e1; padding: 6px; white-space: nowrap; }
        .excel-table th { background-color: #f1f5f9; font-weight: bold; color: #475569; text-transform: uppercase; }
        .excel-table tbody tr:hover { background-color: #f8fafc; }
        .cell-red { background-color: #fee2e2; color: #dc2626; font-weight: bold; }
        .cell-green { background-color: #dcfce7; color: #16a34a; font-weight: bold; }
        .cell-blue { background-color: #e0f2fe; color: #0284c7; font-weight: bold; }
        .cell-yellow { background-color: #fef9c3; color: #ca8a04; font-weight: bold; }
        .safak-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 4px; }
        .safak-box { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 4px; transition: all 0.3s; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #f59e0b; cursor: pointer; }
        #view-goldsilver input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); scale: 1.3; }
        .goldsilver-wrap { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        
        /* Tema Ayarları */
        body.theme-retro { background-color: #050505 !important; }

        body.theme-retro .card, body.theme-retro header, body.theme-retro #sidebar, body.theme-retro table th, body.theme-retro input, body.theme-retro select, body.theme-retro div[class*="bg-"] { background-color: #050505 !important; border: 1px solid #1a5e0b !important; background-image: none !important; box-shadow: none !important; }
        body.theme-retro button, body.theme-retro .btn, body.theme-retro .btn-sidebar { background-color: #0a2405 !important; border: 1px solid #39ff14 !important; }
        body.theme-retro button:hover, body.theme-retro .btn:hover { background-color: #39ff14 !important; color: #000 !important; }
        body.theme-retro button:hover *, body.theme-retro .btn:hover * { color: #000 !important; }
        
        body.theme-cyber { background-color: #0a0414 !important; }
        body.theme-cyber * { font-family: sans-serif !important; border-color: #00f0ff !important; }
        body.theme-cyber .card, body.theme-cyber header, body.theme-cyber #sidebar, body.theme-cyber .bg-white, body.theme-cyber .bg-slate-50, body.theme-cyber .bg-slate-900, body.theme-cyber .bg-slate-950, body.theme-cyber input, body.theme-cyber select { background-color: #120424 !important; border: 1px solid #00f0ff !important; color: #d8cbf0 !important; box-shadow: 0 0 10px rgba(0,240,255,0.1) !important; background-image: none !important; }
        body.theme-cyber h1, body.theme-cyber h2, body.theme-cyber h3, body.theme-cyber .nav-text { color: #00f0ff !important; text-shadow: 0 0 5px rgba(0,240,255,0.5) !important; }
        body.theme-cyber .material-icons { color: #ff007f !important; text-shadow: 0 0 5px rgba(255,0,127,0.5) !important; }
        body.theme-cyber button, body.theme-cyber .btn, body.theme-cyber .btn-sidebar { background-color: rgba(255,0,127,0.1) !important; border: 1px solid #ff007f !important; color: #ff007f !important; box-shadow: 0 0 8px rgba(255,0,127,0.4) !important; }
        body.theme-cyber button:hover, body.theme-cyber .btn:hover { background-color: #ff007f !important; color: #fff !important; }
        body.theme-cyber button:hover *, body.theme-cyber .btn:hover * { color: #fff !important; text-shadow: none !important; }
        body.theme-cyber table th { background-color: #1f0742 !important; color: #00f0ff !important; }
    </style>
</head>
<body class="flex h-screen w-full overflow-hidden theme-default">

    <!-- ARAYÜZ HTML KODLARI (V8.2 ile tamamen aynı kalacak, buraya görseldeki HTML menü ve tablo yapıları gelecek) -->
    <!-- Önceki iletimdeki <aside> ve <main> bölümlerini aynen buraya yerleştirin -->

<script>
// --- OFFLINE API DESTEĞİ İÇİN GÜNCELLENEN GOLDSILVER FONKSİYONU ---
async function fetchGsLivePrices() {
    const btn = document.getElementById('btnFetchPrices');
    
    // OFFLINE KONTROLÜ
    if (!navigator.onLine) {
        btn.innerHTML = "❌ İnternet Yok";
        btn.classList.add("bg-rose-500", "text-white");
        setTimeout(() => {
            btn.innerHTML = "🔄 Verileri Güncelle";
            btn.classList.remove("bg-rose-500", "text-white");
        }, 2000);
        return; // Hata vermeden sistemin IndexedDB verisini kullanmasına izin ver.
    }

    btn.innerText = "⏳ Kontrol...";
    btn.disabled = true;

    try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pax-gold,kinesis-silver,tether&vs_currencies=try,usd');
        if (!res.ok) throw new Error("API hatası");
        
        const data = await res.json();
        const troyGram = 31.1034768;
        
        const goldGram = data['pax-gold'].try / troyGram;
        const silverGram = data['kinesis-silver'].try / troyGram;
        const usdTry = data['tether'].try;
        
        gsState.prices.gold.gram = parseFloat(goldGram.toFixed(2));
        gsState.prices.gold.ons = parseFloat(data['pax-gold'].usd.toFixed(2));
        gsState.prices.silver.gram = parseFloat(silverGram.toFixed(2));
        gsState.prices.silver.ons = parseFloat(data['kinesis-silver'].usd.toFixed(2));
        gsState.prices.usdTry = parseFloat(usdTry.toFixed(2));
        
        const nowTime = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        if (!gsState.priceHistory) gsState.priceHistory = { labels: [], gold: [], silver: [] };
        
        if(gsState.priceHistory.labels[gsState.priceHistory.labels.length - 1] !== nowTime){
            gsState.priceHistory.labels.push(nowTime);
            gsState.priceHistory.gold.push(gsState.prices.gold.gram);
            gsState.priceHistory.silver.push(gsState.prices.silver.gram);
            if(gsState.priceHistory.labels.length > 15) {
                gsState.priceHistory.labels.shift();
                gsState.priceHistory.gold.shift();
                gsState.priceHistory.silver.shift();
            }
        }
        
        document.getElementById('inputPurchaseUsdRate').value = gsState.prices.usdTry;
        saveGsDataToStorage();
        updateGsUIForAsset();
        document.getElementById('lastUpdated').innerText = "Canlı API: " + new Date().toLocaleTimeString('tr-TR');
        
    } catch (err) {
        console.error("API Bağlantı Hatası:", err);
    } finally {
        btn.innerText = "🔄 Verileri Güncelle";
        btn.disabled = false;
    }
}

// (Önceki iletimdeki tüm diğer JS fonksiyonları aynen buraya yerleştirilecek)

</script>
</body>
</html>
